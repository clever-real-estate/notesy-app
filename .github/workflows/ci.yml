name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: sqlite:///db.sqlite3
  SUMMARIZER_API_KEY: ci-only-placeholder
  SUMMARIZER_URL: https://api.summarize.example.com/v1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t notesy:${{ github.sha }} .

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/notesy
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:main \
            .

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/notesy
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:main
