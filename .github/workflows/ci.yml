name: Publish Container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: notesy
  POSTGRES_DB: notesy
  POSTGRES_USER: notesy

jobs:
  publish:
    name: Test and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          TAG="${{ github.ref_name }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.image.outputs.full_image }}" .

      - name: Create CI Docker network
        run: |
          docker network create notesy-ci

      - name: Start PostgreSQL
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker run -d \
            --name notesy-postgres \
            --network notesy-ci \
            -e POSTGRES_DB="${POSTGRES_DB}" \
            -e POSTGRES_USER="${POSTGRES_USER}" \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --health-cmd="pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=10 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' notesy-postgres)"
            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL is healthy"
              exit 0
            fi

            echo "Waiting for PostgreSQL... status=$STATUS"
            sleep 2
          done

          echo "PostgreSQL did not become healthy in time"
          docker logs notesy-postgres
          exit 1

      - name: Run pytest
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker run --rm \
            --network notesy-ci \
            -e DJANGO_SECRET_KEY="ci-test-secret-key-not-for-production" \
            -e DJANGO_OLD_SECRET_KEY="" \
            -e DJANGO_DEBUG="False" \
            -e POSTGRES_DB="${POSTGRES_DB}" \
            -e POSTGRES_USER="${POSTGRES_USER}" \
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            -e POSTGRES_HOST="notesy-postgres" \
            -e POSTGRES_PORT="5432" \
            "${{ steps.image.outputs.full_image }}" \
            pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.full_image }}"

