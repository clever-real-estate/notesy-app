x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-notesy}
  POSTGRES_USER: ${POSTGRES_USER:-notesy}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notesy_dev_password}

x-web-env: &web-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
  DJANGO_OLD_SECRET_KEY: ${DJANGO_OLD_SECRET_KEY:-}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}

  POSTGRES_DB: ${POSTGRES_DB:-notesy}
  POSTGRES_USER: ${POSTGRES_USER:-notesy}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notesy_dev_password}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432

services:
  db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
    volumes:
      - notesy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    image: notesy:local
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *web-env
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  seed:
    image: notesy:local
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - seed-database
    environment:
      <<: *web-env
    command: ["python", "manage.py", "seed"]
    restart: "no"

  web:
    image: notesy:local
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      <<: *web-env

volumes:
  notesy_postgres_data: