services:
  notesy-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB_NAME}
      POSTGRES_USER: ${PG_DB_USER}
      POSTGRES_PASSWORD: ${PG_DB_USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  notesy-web:
    build: .
    command:
      sh -c  "python manage.py migrate --noinput && 
              python manage.py seed &&
              gunicorn notesy.wsgi:application --bind 0.0.0.0:8000" 
      # for production you will setup worker processes to handle simultaneous requests based on the CPU. default is 1 if not specified 
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      notesy-db:
        condition: service_healthy

volumes:
  postgres_data: