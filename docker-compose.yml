# Full local stack: Django (gunicorn) + Postgres.
# One command:  docker compose up --build
# Then open http://localhost:8000  (demo / demo)
#
# Values below are DEV defaults so this runs with zero host setup. Override any
# of them via a host environment or a .env file before `up` for a different
# config. Do NOT use these secrets outside local development.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notesy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notesy_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-notesy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notesy} -d ${POSTGRES_DB:-notesy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only the web service needs it.
    expose:
      - "5432"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-notesy}:${POSTGRES_PASSWORD:-notesy_dev_pw}@db:5432/${POSTGRES_DB:-notesy}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # No TLS locally, so keep HTTPS-only behaviour off. Production leaves
      # these unset (defaults to on when DEBUG=False).
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      # Seed the demo user/notes on first boot for an instant demo.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
