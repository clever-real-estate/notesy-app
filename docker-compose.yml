services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.dev.example
    environment:
      DATABASE_URL: postgres://notesy:notesy_dev_pw@db:5432/notesy
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             gunicorn notesy.wsgi:application --bind 0.0.0.0:8000"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: notesy
      POSTGRES_USER: notesy
      POSTGRES_PASSWORD: notesy_dev_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesy -d notesy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: