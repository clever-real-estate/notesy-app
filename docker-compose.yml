services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notesy
      POSTGRES_PASSWORD: notesy_dev_pw
      POSTGRES_DB: notesy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesy"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgres://notesy:notesy_dev_pw@db:5432/notesy
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/login/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata: